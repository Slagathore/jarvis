# ═══════════════════════════════════════════════════════════════════════════
# JARVIS MASTER CONFIGURATION
# All tunable values live here. Edit this file, not the source code.
# ═══════════════════════════════════════════════════════════════════════════

system:
  name: "Jarvis"
  version: "1.0.0"
  log_level: "DEBUG"          # DEBUG | INFO | WARNING | ERROR
  data_dir: "data/"
  dashboard_enabled: true
  dashboard_port: 7070
  dashboard_host: "0.0.0.0"  # Set to "127.0.0.1" to restrict to localhost

ollama:
  model: "gemini-3-flash-preview:cloud"
  vision_model: "gemini-3-flash-preview:cloud"
  base_url: "http://localhost:11434"
  timeout_seconds: 30
  # Jarvis's core personality and context — edit this to your taste
  # Customize this prompt to match your household — names, pets, work style, etc.
  system_prompt: |
    You are Jarvis, an ambient home AI assistant.
    You live in the house and pay attention to what's going on around you.
    You are observant, helpful, and have a dry wit. You know when to stay quiet.
    You speak like a smart friend, not a customer service bot.
    Never say "I notice" or "I observe" — just say what you see.
    Keep responses short unless asked for detail.

voice:
  whisper:
    model_size: "medium"      # tiny | base | small | medium | large-v3
    device: "cuda"            # cuda | cpu
    compute_type: "float16"   # float16 (GPU) | int8 (CPU)
    language: "en"
    beam_size: 3              # 1 = fastest greedy, 5 = best on long-form. 3 = sweet spot for short commands without over-decoding.
    no_speech_threshold: 0.7  # drops more "I'm guessing" segments to suppress hallucination on marginal audio
    vad_filter: true          # filter silence/breath/noise before decode — without this, medium hallucinates plausible-sounding nonsense from quiet input
    vad_parameters:
      # faster-whisper 1.x VadOptions fields: onset, offset, min_speech_duration_ms,
      # max_speech_duration_s, min_silence_duration_ms, speech_pad_ms.
      # 'onset' was named 'threshold' in older versions — keep this in sync if you upgrade.
      onset: 0.5                    # speech probability cutoff to enter speech
      min_speech_duration_ms: 100   # default 250 — keep brief one-word commands
      min_silence_duration_ms: 300  # default 2000 — allow short pauses inside an utterance
    debug_save_empty: true    # dump captured audio to data/debug/ when transcript is empty
  tts:
    engine: "piper"
    active_voice: "glados"
    # Per-room TTS routing — when true AND the room's ESP node is online, send
    # TTS audio bytes over MQTT to the node's speaker instead of playing locally.
    # Default OFF because the ESP firmware doesn't yet play received audio_out;
    # turning it on would mean Jarvis appears silent until the firmware is updated.
    route_to_nodes: false
    piper_binary: "C:/Users/Cole/CodeStuff/Misc/piper/piper.exe"
    voices:
      glados:   "C:/Users/Cole/CodeStuff/Misc/piper/voices/vits-piper-en_US-glados-high/en_US-glados-high.onnx"
      wheatley: "C:/Users/Cole/CodeStuff/Misc/piper/voices/wheatley1/wheatley1.onnx"
    speed: 1.0
    sample_rate: 22050
  wake_word:
    model: "hey_jarvis"       # openWakeWord model name
    sensitivity: 0.5          # 0.0-1.0, higher = more sensitive (more false positives)
    cooldown_seconds: 3
    # Optional: substring of mic device name (case-insensitive) or integer index.
    # Leave blank/null to use the system default. Run `python -c "import sounddevice; print(sounddevice.query_devices())"` to list devices.
    device: null
  audio_focus:
    enabled: true       # Duck other apps' volume while Jarvis speaks (Windows only)
    duck_factor: 0.2    # Duck to 20% during TTS, restore after

  recording:
    sample_rate: 16000
    # mode: "fixed" → record exactly fixed_duration_seconds, ignoring volume.
    #       "silence" → wait for speech, stop after silence_duration_ms of silence.
    # Use "fixed" when your mic/voice combo doesn't reliably exceed the silence
    # threshold (so silence-mode never starts recording).
    mode: "silence"
    fixed_duration_seconds: 7
    # -45 dBFS = "speaking AT the mic" loudness. With sensitive mics (HyperX
    # SoloCast etc.) ambient noise (TV, distant conversation) sits around -55
    # to -50, so a -60 threshold treats noise as ongoing speech and never stops
    # recording. -45 means actual direct speech still registers but ambient
    # drops cleanly into "silence" so the recorder can terminate.
    silence_threshold_db: -45
    silence_duration_ms: 800   # was 1500 — bail fast when Cole stops
    max_duration_seconds: 10   # was 30 — hard cap so noisy environments can't
                               # produce a 30s recording for a 1s utterance

mqtt:
  broker: "localhost"
  port: 1883
  username: ""                 # Set in .env if using auth: MQTT_USERNAME
  password: ""                 # Set in .env if using auth: MQTT_PASSWORD
  keepalive: 60
  reconnect_delay_seconds: 5
  topics:
    wake:      "jarvis/nodes/{room}/wake"
    audio_in:  "jarvis/nodes/{room}/audio/in"
    audio_out: "jarvis/nodes/{room}/audio/out"
    status:    "jarvis/nodes/{room}/status"
    vision:    "jarvis/vision/{room}/frame"
    reminder:  "jarvis/events/reminder"
    state:     "jarvis/system/state"         # Broadcast current activity state

rooms:
  - id: "office_cam"
    display_name: "Office Cam"
    camera_source: 0          # USB webcam (device index 0)
    has_node: false
    node_ip: null
  - id: "office"              # ESP32-CAM node — firmware publishes as room_id "office"
    display_name: "Office"
    camera_source: null
    has_node: true
    node_ip: "192.168.1.101"
  - id: "bedroom"
    display_name: "Bedroom"
    camera_source: null        # null until ESP32-CAM deployed
    has_node: false
    node_ip: null
  - id: "kitchen"
    display_name: "Kitchen"
    camera_source: null
    has_node: false
    node_ip: null
  - id: "living_room"
    display_name: "Living Room"
    camera_source: null
    has_node: false
    node_ip: null

context:
  vision_scan_interval_minutes: 1
  pc_poll_interval_seconds: 10
  audio_classify_window_seconds: 3
  posture_analysis_fps: 1
  os_idle_away_seconds: 600      # PCMonitor overrides activity to "away" after this many idle seconds (no kbd/mouse)

vision:
  # Mean absolute pixel difference (0-255 grayscale, blurred + downscaled) above
  # which the scene is considered changed enough to re-describe via the LLM.
  # Static room (good camera): ~1-4. Person moving: ~10-20. Big scene change: 25+.
  # Lower = more sensitive (more LLM calls). Higher = quieter (more cached descs).
  scene_change_threshold: 12.0
  # Per-room overrides for noisy cameras. ESP32-CAM in low light has high
  # frame-to-frame sensor noise that masquerades as "change" — bump it higher.
  scene_change_threshold_per_room:
    office: 25.0   # ESP32-CAM, noisy sensor

anomaly:
  # When a current scene description's similarity score vs its baseline (0=same,
  # 10=radically different) is at or above this number, fire a room_anomaly event.
  alert_threshold: 6.0
  # Min seconds between scoring a given room. Stops the LLM getting hammered.
  cooldown_seconds: 600

mess:
  # Absolute tidiness scoring (0=immaculate, 10=disaster). Independent of
  # baseline — used for "kitchen looks unusually messy" type comments.
  alert_threshold: 6.5
  # 30 minutes between scores per room — tidiness changes slowly.
  cooldown_seconds: 1800

fusion:
  # State fusion uses weighted-vote on signals, optionally blended with a
  # time-of-day prior learned from activity_log. 0.0 = pure weighted vote
  # (legacy). 0.1 = each prior occurrence bumps the matching vote by 10%.
  # Higher values let the routine override sparse / noisy signals more.
  prior_weight: 0.1

webhooks:
  # Inbound: POST /api/webhook/<name> with X-Webhook-Token header → emits a
  # 'webhook.<name>' event onto the internal bus that other modules can subscribe to.
  # Empty by default — add named entries with secret tokens to enable.
  inbound_tokens: {}
  # Example:
  # inbound_tokens:
  #   ifttt_doorbell: "REPLACE_WITH_LONG_RANDOM_STRING"

  # Outbound: when these internal event types fire, POST the payload to the listed URLs.
  # Use any internal event name (speech, reminder.due, room_anomaly, person_recognized,
  # appliance.state_changed, calendar_added, etc.) Empty by default.
  outbound: {}
  # Example:
  # outbound:
  #   person_recognized:
  #     - "http://homeassistant.local:8123/api/webhook/jarvis_person_seen"
  #   reminder.due:
  #     - "https://maker.ifttt.com/trigger/jarvis_reminder/with/key/XYZ"

  timeout_seconds: 10

interruptibility:
  quiet_hours_start: "22:00"
  quiet_hours_end: "08:00"
  interrupt_cooldown_minutes: 5
  activity_scores:
    sleeping:        0.00
    napping:         0.00
    gaming:          0.15
    coding:          0.20
    reading:         0.30
    watching_media:  0.25
    video_call:      0.05
    cooking:         0.70
    eating:          0.50
    browsing_social: 0.80
    browsing_general: 0.65
    writing:         0.25
    note_taking:     0.40
    ai_image_gen:    0.60
    idle:            0.90
    away:            0.00
    unknown:         0.50

curiosity:
  enabled: true
  topic_cooldowns_hours:
    gaming:    4
    reading:   6
    nap_check: 12
    morning:   24
    cooking:   2
    comfyui:   3
    coding:    8
  # Minimum interruptibility score required for proactive speech
  min_interruptibility: 0.35
  # How often (seconds) to check for proactive speech opportunities
  check_interval_seconds: 60

appliances:
  washer_min_cycle_minutes: 25
  dryer_done_urgency: 0.8
  dishwasher_done_urgency: 0.4
  silence_done_threshold_seconds: 120

memory:
  db_path: "data/jarvis.db"
  max_conversation_turns: 20
  room_baseline_update_hours: 24
  prompt_memory_events: 8        # how many recent non-speech events to inject as system-prompt context
  eod_summary_hour: 23           # local hour to generate end-of-day summary
  eod_summary_minute: 0
  eod_summary_speak: false       # set true to have Jarvis speak the summary out loud at EOD

reminders:
  poll_interval_seconds: 30   # How often the scheduler checks for due reminders

calendar:
  credentials_path: "data/google_credentials.json"  # OAuth client JSON from Google Cloud Console
  token_path: "data/google_token.json"              # cached refresh token (auto-created on first auth)
  calendar_id: "primary"                            # "primary" = your default calendar
  timezone: "America/Chicago"                       # IANA tz for new events
  alert_lead_minutes: 10                            # proactive announcement lead time before an event starts
  alert_poll_seconds: 60                            # how often the alert loop checks the calendar

# ── Process → Activity mapping for PC monitor ──────────────────────────────
# Key is the process .exe name (case-insensitive), value is the activity label.
# Window title keywords (checked against active window title) override process name.
