system:
  name: Jarvis
  version: 1.0.0
  log_level: DEBUG
  data_dir: data/
  dashboard_enabled: true
  dashboard_port: 7070
  dashboard_host: 0.0.0.0
  event_bus:
    max_queue_size: 1000
    rate_limits:
      audio.level:
        per_second: 12
        burst: 24
      world.state_snapshot:
        per_second: 0.5
        burst: 2
ollama:
  model: gemini-3-flash-preview:cloud
  vision_model: gemini-3-flash-preview:cloud
  action_model: gemini-3-flash-preview:cloud
  base_url: http://localhost:11434
  timeout_seconds: 30
  system_prompt: "You are Jarvis, an ambient home AI assistant.\nYou live in the house\
    \ and pay attention to what's going on around you.\nYou are observant, helpful,\
    \ and have a dry wit. You know when to stay quiet.\nYou speak like a smart friend,\
    \ not a customer service bot.\nNever say \"I notice\" or \"I observe\" \u2014\
    \ just say what you see.\nKeep responses short unless asked for detail.\n"
voice:
  whisper:
    model_size: medium
    device: cuda
    compute_type: float16
    language: en
    beam_size: 3
    no_speech_threshold: 0.7
    vad_filter: true
    vad_parameters:
      onset: 0.5
      min_speech_duration_ms: 100
      min_silence_duration_ms: 300
    debug_save_empty: true
  tts:
    engine: piper
    active_voice: glados
    piper_binary: C:/Users/Cole/CodeStuff/Misc/piper/piper.exe
    # Display name → .onnx path. Add new voices by dropping the model
    # folder under C:/Users/Cole/CodeStuff/Misc/piper/voices/ then adding
    # one line here. Switching between configured voices is hot — the
    # dashboard dropdown calls PiperTTS.set_voice() which swaps live.
    # New voices are picked up on Jarvis restart.
    voices:
      glados: C:/Users/Cole/CodeStuff/Misc/piper/voices/vits-piper-en_US-glados-high/en_US-glados-high.onnx
      wheatley: C:/Users/Cole/CodeStuff/Misc/piper/voices/wheatley1/wheatley1.onnx
      cori: C:/Users/Cole/CodeStuff/Misc/piper/voices/cori/high/en_GB-cori-high.onnx
      cori_medium: C:/Users/Cole/CodeStuff/Misc/piper/voices/cori/medium/en_GB-cori-medium.onnx
      jenny: C:/Users/Cole/CodeStuff/Misc/piper/voices/jenny_dioco/medium/en_GB-jenny_dioco-medium.onnx
      kathleen: C:/Users/Cole/CodeStuff/Misc/piper/voices/kathleen/low/en_US-kathleen-low.onnx
      kristin: C:/Users/Cole/CodeStuff/Misc/piper/voices/kristin/medium/en_US-kristin-medium.onnx
      libritts: C:/Users/Cole/CodeStuff/Misc/piper/voices/libritts/high/en_US-libritts-high.onnx
      southern_female: C:/Users/Cole/CodeStuff/Misc/piper/voices/southern_english_female/low/en_GB-southern_english_female-low.onnx
    speed: 1.0
    sample_rate: 22050
  wake_word:
    model: hey_jarvis
    sensitivity: 0.5
    cooldown_seconds: 3
    device: null
  audio_focus:
    enabled: true
    duck_factor: 0.2
  recording:
    sample_rate: 16000
    mode: silence
    fixed_duration_seconds: 7
    silence_threshold_db: -45
    silence_duration_ms: 2000
    max_duration_seconds: 60
    adaptive_noise_floor: true
    follow_up_listen_seconds: 6
mqtt:
  broker: localhost
  port: 1883
  username: ''
  password: ''
  keepalive: 60
  reconnect_delay_seconds: 5
  topics:
    wake: jarvis/nodes/{room}/wake
    audio_in: jarvis/nodes/{room}/audio/in
    audio_out: jarvis/nodes/{room}/audio/out
    status: jarvis/nodes/{room}/status
    vision: jarvis/vision/{room}/frame
    reminder: jarvis/events/reminder
    state: jarvis/system/state
rooms:
- id: office
  display_name: Office
  video:
    type: usb_index
    device_index: 0
  mic:
    type: usb_device_mic
    device_name: default
    sample_rate_hz: 16000
    channels: 1
  speaker:
    type: usb_device_spk
    device_name: default
    sample_rate_hz: 22050
    channels: 1
  fps_active: 10
  fps_idle: 5
  # World Model geometry. Polygon coordinates below are PLACEHOLDERS — the
  # actual desk / under_desk / door regions need to be drawn against a real
  # frame from this camera (Phase 3.4 dashboard polygon viewer). Bbox
  # coordinates are camera pixel space (origin top-left).
  world_model:
    enabled: true
    frame_width: 640    # REPLACE_ME: confirm with `cv2.VideoCapture(0).get(...)`
    frame_height: 480
    exits:
      # Right edge → hallway / living_room. Adjust polygon so a person
      # walking out of frame on the right has bbox center over this region.
      - kind: to_room
        to: living_room   # REPLACE_ME: this Office cam doesn't physically
                          # see a doorway; remove this exit if office is
                          # an isolated work area, or change `to` to the
                          # correct neighbor room id.
        polygon: [[600, 0], [640, 0], [640, 480], [600, 480]]
    landmarks:
      # The under_desk landmark is the one Phase 1.7's verify gate cares
      # about — Cole crouching here = IN_ROOM_UNSEEN, not DEPARTED.
      - name: desk
        polygon: [[200, 250], [450, 250], [450, 400], [200, 400]]
      - name: under_desk
        polygon: [[200, 380], [450, 380], [450, 480], [200, 480]]
      - name: bookshelf
        polygon: [[0, 100], [150, 100], [150, 350], [0, 350]]
      # §22.9 cat-care — office cats get fed here (Socks + Serval).
      # REPLACE_ME polygon against a real office-cam frame.
      - name: food_dish
        polygon: [[0, 350], [120, 350], [120, 480], [0, 480]]
- id: laundry_room
  display_name: Laundry Room
  video:
    type: esp32_http
    url: http://192.168.1.101:8081/
  mic:
    type: esp32_i2s_mic
    mqtt_topic: jarvis/nodes/laundry_room/audio/in
  speaker:
    type: esp32_i2s_spk
    mqtt_topic: jarvis/nodes/laundry_room/audio/out
  fps_active: 5
  fps_idle: 1
  world_model:
    enabled: true
    frame_width: 800    # REPLACE_ME: confirm ESP32-CAM resolution
    frame_height: 600
    exits:
      - kind: to_room
        to: kitchen     # REPLACE_ME: confirm laundry-room neighbor
        polygon: [[0, 200], [80, 200], [80, 500], [0, 500]]
    landmarks:
      - name: washer
        polygon: [[200, 300], [450, 300], [450, 550], [200, 550]]
      - name: dryer
        polygon: [[450, 300], [700, 300], [700, 550], [450, 550]]
      # No cat / dog landmarks here — the laundry_room ESP32-CAM doesn't
      # actually face the food dishes or litterboxes Cole has on the
      # property. §22.9 events live on the kitchen / office / bedroom /
      # living_room cams where the relevant landmarks are visible.
- id: bedroom
  display_name: Bedroom
  video:
    type: wyze_rtsp
    url: rtsp://${WYZE_RTSP_USER}:${WYZE_RTSP_PASSWORD}@192.168.1.137:8554/1080p
    transport: tcp
  mic:
    type: wyze_rtsp_audio
    url: rtsp://${WYZE_RTSP_USER}:${WYZE_RTSP_PASSWORD}@192.168.1.137:8554/audio_only
    transport: tcp
    sample_rate_hz: 16000
    channels: 1
  speaker:
    type: wyze_ssh_aplay
    host: 192.168.1.137
    ssh_user: ${WYZE_SSH_USER}
    ssh_password: ${WYZE_SSH_PASSWORD}
    ssh_key_path: ${WYZE_SSH_KEY_PATH}
    remote_play_path: /tmp/jarvis_play.wav
    volume: 60
    sample_rate_hz: 8000
  fps_active: 5
  fps_idle: 1
  world_model:
    enabled: true
    frame_width: 1920
    frame_height: 1080
    exits:
      # Bedroom → hallway / living_room handoff. Adjust to whichever
      # camera's FOV picks Cole up next when he walks out.
      - kind: to_room
        to: living_room   # REPLACE_ME: confirm
        polygon: [[0, 400], [150, 400], [150, 1080], [0, 1080]]
      # Two unmonitored bedrooms / bathroom adjacent — ESP/Wyze blindspots.
      # Coarse polygon: anything along that wall counts as transit into
      # the unmonitored zone. Refine with polygon viewer.
      - kind: to_unmonitored_zone
        to: bathroom_master   # REPLACE_ME
        polygon: [[1700, 200], [1920, 200], [1920, 700], [1700, 700]]
    landmarks:
      - name: bed
        polygon: [[600, 500], [1400, 500], [1400, 950], [600, 950]]
      - name: closet
        polygon: [[1500, 700], [1920, 700], [1920, 1080], [1500, 1080]]
      # §22.9 cat-care — bedroom cats get fed here (Spooky + Sparta).
      # REPLACE_ME polygon against a real bedroom-cam frame.
      - name: food_dish
        polygon: [[200, 800], [400, 800], [400, 1000], [200, 1000]]
- id: kitchen
  display_name: Kitchen
  video:
    type: wyze_rtsp
    url: rtsp://${WYZE_RTSP_USER}:${WYZE_RTSP_PASSWORD}@192.168.1.136:8554/1080p
    transport: tcp
  mic:
    type: wyze_rtsp_audio
    url: rtsp://${WYZE_RTSP_USER}:${WYZE_RTSP_PASSWORD}@192.168.1.136:8554/audio_only
    transport: tcp
    sample_rate_hz: 16000
    channels: 1
  speaker:
    type: wyze_ssh_aplay
    host: 192.168.1.136
    ssh_user: ${WYZE_SSH_USER}
    ssh_password: ${WYZE_SSH_PASSWORD}
    ssh_key_path: ${WYZE_SSH_KEY_PATH}
    remote_play_path: /tmp/jarvis_play.wav
    volume: 60
    sample_rate_hz: 8000
  fps_active: 5
  fps_idle: 1
  world_model:
    enabled: true
    frame_width: 1920
    frame_height: 1080
    exits:
      - kind: to_room
        to: living_room
        polygon: [[0, 0], [200, 0], [200, 1080], [0, 1080]]
      # Back door — exterior_exit polygons are CRUCIAL for DEPARTED state.
      # Polygon should cover the actual door region; current value is a
      # conservative lower-right corner. REPLACE_ME via polygon viewer.
      - kind: exterior_exit
        name: back_door
        polygon: [[1700, 800], [1920, 800], [1920, 1080], [1700, 1080]]
    landmarks:
      - name: stove
        polygon: [[800, 200], [1100, 200], [1100, 600], [800, 600]]
      - name: fridge
        polygon: [[1400, 100], [1700, 100], [1700, 700], [1400, 700]]
      # Per §22.1, kitchen-fridge-top is a Velcro perch; that's a 3D
      # region that may need a separate polygon once we add multi-cam.
      # §22.9 cat-care — automated litterbox is immediately to the right
      # of the fridge. REPLACE_ME polygon against a real kitchen-cam
      # frame; the placeholder sits in x>fridge.right, above the
      # back_door exterior_exit polygon.
      - name: litterbox
        polygon: [[1700, 300], [1900, 300], [1900, 750], [1700, 750]]
      # §22.9 dog-care — Cole refills dog water bowl in the kitchen.
      # REPLACE_ME polygon (the sink-area is a reasonable placeholder).
      - name: dog_water_bowl
        polygon: [[400, 700], [600, 700], [600, 900], [400, 900]]
- id: living_room
  display_name: Living Room
  video:
    type: wyze_rtsp
    url: rtsp://${WYZE_RTSP_USER}:${WYZE_RTSP_PASSWORD}@192.168.1.134:8554/1080p
    transport: tcp
  mic:
    type: wyze_rtsp_audio
    url: rtsp://${WYZE_RTSP_USER}:${WYZE_RTSP_PASSWORD}@192.168.1.134:8554/audio_only
    transport: tcp
    sample_rate_hz: 16000
    channels: 1
  speaker:
    type: wyze_ssh_aplay
    host: 192.168.1.134
    ssh_user: ${WYZE_SSH_USER}
    ssh_password: ${WYZE_SSH_PASSWORD}
    ssh_key_path: ${WYZE_SSH_KEY_PATH}
    remote_play_path: /tmp/jarvis_play.wav
    volume: 60
    sample_rate_hz: 8000
  fps_active: 5
  fps_idle: 1
  world_model:
    enabled: true
    frame_width: 1920
    frame_height: 1080
    exits:
      - kind: to_room
        to: bedroom
        polygon: [[0, 400], [200, 400], [200, 1080], [0, 1080]]
      - kind: to_room
        to: kitchen
        polygon: [[1700, 0], [1920, 0], [1920, 600], [1700, 600]]
      # Front door — main exterior_exit. Crucial for DEPARTED state.
      - kind: exterior_exit
        name: front_door
        polygon: [[800, 800], [1100, 800], [1100, 1080], [800, 1080]]
      # Two unmonitored bedrooms (no cams facing those doors). Coarse
      # region polygons — the doc (§7) calls these "best-effort";
      # falling-back to IN_ROOM_UNSEEN is the acceptable fail mode.
      - kind: to_unmonitored_zone
        to: spare_bedroom_1   # REPLACE_ME
        polygon: [[1500, 600], [1700, 600], [1700, 900], [1500, 900]]
      - kind: to_unmonitored_zone
        to: jeff_room         # Per §22.0a — Velcro lives in this room
        polygon: [[200, 600], [400, 600], [400, 900], [200, 900]]
    landmarks:
      - name: couch
        polygon: [[600, 600], [1400, 600], [1400, 950], [600, 950]]
      - name: tv
        polygon: [[700, 100], [1300, 100], [1300, 450], [700, 450]]
      # §22.9 dog-care — dogs are fed in the living_room. Leash_hook is
      # also here. dog_water_bowl is NOT here — the bowl in the
      # living_room sits directly under the camera and isn't reliably
      # visible; the kitchen cam owns that signal (Cole refills there).
      # REPLACE_ME polygon coords against a real living_room frame.
      - name: dog_food_dish
        polygon: [[450, 700], [580, 700], [580, 800], [450, 800]]
      - name: leash_hook
        polygon: [[50, 100], [150, 100], [150, 200], [50, 200]]
# Auxiliary ESP32 nodes — boxes physically present in rooms whose primary
# mic/cam is *not* an esp32_* driver. NodeManager would auto-register these
# on first MQTT heartbeat with a warning; listing them here acknowledges the
# hardware so the heartbeat is treated as expected. Add a node here when you
# flash an ESP for a room (e.g. for sensors, status LEDs, future audio).
