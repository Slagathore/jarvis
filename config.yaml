system:
  name: Jarvis
  version: 1.0.0
  log_level: DEBUG
  data_dir: data/
  dashboard_enabled: true
  dashboard_port: 7070
  dashboard_host: 0.0.0.0
ollama:
  model: gemini-3-flash-preview:cloud
  vision_model: gemini-3-flash-preview:cloud
  action_model: gemini-3-flash-preview:cloud
  base_url: http://localhost:11434
  timeout_seconds: 30
  system_prompt: "You are Jarvis, an ambient home AI assistant.\nYou live in the house\
    \ and pay attention to what's going on around you.\nYou are observant, helpful,\
    \ and have a dry wit. You know when to stay quiet.\nYou speak like a smart friend,\
    \ not a customer service bot.\nNever say \"I notice\" or \"I observe\" \u2014\
    \ just say what you see.\nKeep responses short unless asked for detail.\n"
voice:
  whisper:
    model_size: medium
    device: cuda
    compute_type: float16
    language: en
    beam_size: 3
    no_speech_threshold: 0.7
    vad_filter: true
    vad_parameters:
      onset: 0.5
      min_speech_duration_ms: 100
      min_silence_duration_ms: 300
    debug_save_empty: true
  tts:
    engine: piper
    active_voice: glados
    piper_binary: C:/Users/Cole/CodeStuff/Misc/piper/piper.exe
    # Display name → .onnx path. Add new voices by dropping the model
    # folder under C:/Users/Cole/CodeStuff/Misc/piper/voices/ then adding
    # one line here. Switching between configured voices is hot — the
    # dashboard dropdown calls PiperTTS.set_voice() which swaps live.
    # New voices are picked up on Jarvis restart.
    voices:
      glados: C:/Users/Cole/CodeStuff/Misc/piper/voices/vits-piper-en_US-glados-high/en_US-glados-high.onnx
      wheatley: C:/Users/Cole/CodeStuff/Misc/piper/voices/wheatley1/wheatley1.onnx
      cori: C:/Users/Cole/CodeStuff/Misc/piper/voices/cori/high/en_GB-cori-high.onnx
      cori_medium: C:/Users/Cole/CodeStuff/Misc/piper/voices/cori/medium/en_GB-cori-medium.onnx
      jenny: C:/Users/Cole/CodeStuff/Misc/piper/voices/jenny_dioco/medium/en_GB-jenny_dioco-medium.onnx
      kathleen: C:/Users/Cole/CodeStuff/Misc/piper/voices/kathleen/low/en_US-kathleen-low.onnx
      kristin: C:/Users/Cole/CodeStuff/Misc/piper/voices/kristin/medium/en_US-kristin-medium.onnx
      libritts: C:/Users/Cole/CodeStuff/Misc/piper/voices/libritts/high/en_US-libritts-high.onnx
      southern_female: C:/Users/Cole/CodeStuff/Misc/piper/voices/southern_english_female/low/en_GB-southern_english_female-low.onnx
    speed: 1.0
    sample_rate: 22050
  wake_word:
    model: hey_jarvis
    sensitivity: 0.5
    cooldown_seconds: 3
    device: null
  audio_focus:
    enabled: true
    duck_factor: 0.2
  recording:
    sample_rate: 16000
    mode: silence
    fixed_duration_seconds: 7
    silence_threshold_db: -45
    silence_duration_ms: 2000
    max_duration_seconds: 60
    adaptive_noise_floor: true
    follow_up_listen_seconds: 6
mqtt:
  broker: localhost
  port: 1883
  username: ''
  password: ''
  keepalive: 60
  reconnect_delay_seconds: 5
  topics:
    wake: jarvis/nodes/{room}/wake
    audio_in: jarvis/nodes/{room}/audio/in
    audio_out: jarvis/nodes/{room}/audio/out
    status: jarvis/nodes/{room}/status
    vision: jarvis/vision/{room}/frame
    reminder: jarvis/events/reminder
    state: jarvis/system/state
rooms:
